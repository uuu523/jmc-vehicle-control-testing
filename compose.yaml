services:
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: vehicle-mqtt

    ports:
      - "127.0.0.1:1883:1883"

    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

    restart: unless-stopped

volumes:
  mqtt-data: